<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Challenges | LevelUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/challenges.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>⚡ LevelUp</h2>
            <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="challenges.html">Challenges</a><a
                    href="progress.html">Progress</a><a href="achievements.html">Achievements</a><a href="#"
                    onclick="logout()">Logout</a></nav>
        </aside>
        <main class="main">
            <h1 class="page-title">Daftar Challenge</h1>
            <p class="muted">Pilih tantangan yang sesuai dengan target pengembangan dirimu.</p>
            <div class="filters"><input id="search" class="form-control" style="max-width:320px"
                    placeholder="Cari challenge..."><select id="category" class="form-control" style="max-width:220px">
                    <option value="">Semua kategori</option>
                    <option>Produktivitas</option>
                    <option>Kesehatan</option>
                    <option>Edukasi</option>
                    <option>Gaya Hidup</option>
                </select></div>
            <div id="challengeList" class="grid grid-3"></div>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/challenges.js"></script>
</body>

</html>
