<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard | LevelUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>⚡ LevelUp</h2>
            <nav class="nav"><a href="dashboard.html">Dashboard</a><a href="challenges.html">Challenges</a><a
                    href="progress.html">Progress</a><a href="achievements.html">Achievements</a><a href="#"
                    onclick="logout()">Logout</a></nav>
        </aside>
        <main class="main">
            <div class="topbar">
                <div>
                    <h1 class="page-title">Dashboard</h1>
                    <p class="muted">Pantau perkembangan challenge-mu.</p>
                </div><b id="userName"></b>
            </div>
            <div class="card welcome">
                <h2>Selamat datang di LevelUp 👋</h2>
                <p>Ambil challenge, kirim bukti, dan kumpulkan poin untuk membuka achievement.</p>
            </div>
            <div class="grid grid-4" style="margin-top:18px">
                <div class="card stat"><span class="muted">Challenge tersedia</span>
                    <h3 id="totalChallenges">0</h3>
                </div>
                <div class="card stat"><span class="muted">Diikuti</span>
                    <h3 id="joinedCount">0</h3>
                </div>
                <div class="card stat"><span class="muted">Selesai</span>
                    <h3 id="completedCount">0</h3>
                </div>
                <div class="card stat"><span class="muted">Total poin</span>
                    <h3 id="points">0</h3>
                </div>
            </div>
            <div class="card" style="margin-top:18px">
                <h2>Challenge Terbaru</h2>
                <div id="recentChallenges"></div>
            </div>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
