<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | LevelUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <main class="login-card">
        <div class="brand">
            <div class="brand-logo">L↑</div>
            <h1>LevelUp</h1>
            <p class="muted">Challenge yourself, grow every day.</p>
        </div>
        <div id="message"></div>
        <form id="loginForm">
            <div class="form-group"><label>Email</label><input class="form-control" id="email" type="email" required
                    placeholder="nama@email.com"></div>
            <div class="form-group"><label>Password</label><input class="form-control" id="password" type="password"
                    required placeholder="••••••••"></div><button class="btn btn-primary"
                style="width:100%">Masuk</button>
        </form>
        <div class="login-hint"><b>Akun demo</b><br>User: user@levelup.id / user123<br>Admin: admin@levelup.id /
            admin123</div>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
